name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  house:
    uses: neolunadev/.github/.github/workflows/house.yml@main
    with:
      markdownlint: false
      allow-data: false

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Unit tests are hardware-free by design: audio and GPU layers are
      # monkeypatched, heavy deps import lazily. No torch/models needed here.
      - name: Install test dependencies
        run: pip install pytest numpy soundfile
      - name: Lint (undefined names, unused imports)
        run: |
          pip install ruff
          ruff check .
      - name: Check JavaScript syntax
        run: node --check app/ui/app.js
      - name: Byte-compile all sources
        run: python -m compileall -q app engine bot.py scripts
      - name: Run tests
        run: python -m pytest -q
